<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LongCat AI · 智能对话助手</title>
    <meta name="description" content="基于 LongCat-2.0 的智能 AI 对话助手，提供流畅自然的对话体验">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.8.0/build/highlight.min.js"></script>

    <style>
        /* ===== CSS 变量 & 主题 ===== */
        :root {
            --bg-from: #0f0c29;
            --bg-mid:  #302b63;
            --bg-to:   #24243e;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --accent: #7c3aed;
            --accent-light: #a78bfa;
            --accent-glow: rgba(124, 58, 237, 0.4);
            --user-msg-from: #7c3aed;
            --user-msg-to:   #4f46e5;
            --ai-msg-bg: rgba(255, 255, 255, 0.08);
            --ai-msg-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.07);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus-border: #7c3aed;
            --scrollbar-thumb: rgba(124, 58, 237, 0.4);
            --radius-msg: 18px;
            --radius-container: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== 全局重置 ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-from) 0%, var(--bg-mid) 50%, var(--bg-to) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ===== 应用外层居中布局 ===== */
        .app-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 12px;
            width: calc(100vw - 32px);
            max-width: 1180px;
            height: calc(100vh - 32px);
            max-height: 900px;
            animation: containerIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes containerIn {
            from { opacity: 0; transform: scale(0.94) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            width: 260px;
            min-width: 260px;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width 0.3s cubic-bezier(0.4,0,0.2,1),
                        min-width 0.3s cubic-bezier(0.4,0,0.2,1),
                        opacity 0.3s ease;
            flex-shrink: 0;
        }
        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            opacity: 0;
            pointer-events: none;
            border: none;
        }
        /* 侧边栏顶部 */
        .sidebar-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .sidebar-logo {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-light);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .new-chat-btn {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--user-msg-from), var(--user-msg-to));
            border: none;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(124,58,237,0.35);
        }
        .new-chat-btn:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(124,58,237,0.5);
        }
        /* 侧边栏列表 */
        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .sidebar-list::-webkit-scrollbar { width: 4px; }
        .sidebar-list::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 2px;
        }
        .sidebar-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 32px 16px;
            line-height: 1.7;
        }
        .session-item {
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid transparent;
            position: relative;
            min-width: 0;
        }
        .session-item:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.08);
        }
        .session-item.active {
            background: rgba(124,58,237,0.15);
            border-color: rgba(124,58,237,0.3);
        }
        .session-icon {
            font-size: 1rem;
            flex-shrink: 0;
            opacity: 0.8;
        }
        .session-info {
            flex: 1;
            min-width: 0;
        }
        .session-title {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-item.active .session-title { color: var(--accent-light); }
        .session-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .session-del-btn {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 6px;
            font-size: 0.75rem;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .session-item:hover .session-del-btn { opacity: 1; }
        .session-del-btn:hover {
            background: rgba(239,68,68,0.15);
            color: #f87171;
        }
        /* 会话操作菜单 */
        .session-menu-btn {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 1rem;
            transition: var(--transition);
            flex-shrink: 0;
            line-height: 1;
        }
        .session-item:hover .session-menu-btn { opacity: 1; }
        .session-menu-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
        .session-menu-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 2px);
            background: rgba(18,14,38,0.97);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 4px;
            display: none;
            flex-direction: column;
            gap: 2px;
            z-index: 200;
            min-width: 110px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .session-menu-dropdown.open { display: flex; }
        .session-menu-opt {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
            font-family: 'Inter', sans-serif;
            width: 100%;
            text-align: left;
        }
        .session-menu-opt:hover { background: rgba(124,58,237,0.18); color: var(--text-primary); }
        .session-menu-opt.danger:hover { background: rgba(239,68,68,0.15); color: #f87171; }
        .session-rename-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.85rem;
            padding: 2px 4px;
            outline: none;
            box-sizing: border-box;
        }
        .session-rename-input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 2px rgba(110, 114, 255, 0.3);
        }
        /* 侧边栏底部 */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--glass-border);
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }

        /* ===== 动态背景粒子 ===== */
        .bg-particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: floatParticle linear infinite;
        }
        .particle:nth-child(1)  { width: 300px; height: 300px; background: radial-gradient(circle, #7c3aed, transparent); top: -150px; left: -100px; animation-duration: 20s; }
        .particle:nth-child(2)  { width: 200px; height: 200px; background: radial-gradient(circle, #4f46e5, transparent); top: 60%; right: -80px; animation-duration: 25s; animation-delay: -8s; }
        .particle:nth-child(3)  { width: 150px; height: 150px; background: radial-gradient(circle, #a78bfa, transparent); bottom: -50px; left: 40%; animation-duration: 18s; animation-delay: -4s; }
        @keyframes floatParticle {
            0%   { transform: translateY(0) rotate(0deg) scale(1); }
            33%  { transform: translateY(-30px) rotate(120deg) scale(1.05); }
            66%  { transform: translateY(20px) rotate(240deg) scale(0.95); }
            100% { transform: translateY(0) rotate(360deg) scale(1); }
        }

        /* ===== 主聊天容器 ===== */
        .chat-container {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-container);
            box-shadow: var(--glass-shadow), 0 0 0 1px rgba(255,255,255,0.04) inset;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 顶部标题栏 ===== */
        .chat-header {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03);
            flex-shrink: 0;
        }
        .header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--user-msg-from), var(--user-msg-to));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 4px 15px var(--accent-glow);
            flex-shrink: 0;
        }
        .header-info { flex: 1; }
        .header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.6; transform: scale(0.8); }
        }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }

        /* ===== Markdown 渲染样式 ===== */
        .markdown-body {
            line-height: 1.6;
            word-wrap: break-word;
        }
        .markdown-body p { margin: 0 0 10px 0; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            margin: 16px 0 8px 0; font-weight: 600; line-height: 1.25; color: var(--accent-light);
        }
        .markdown-body h1 { font-size: 1.3em; }
        .markdown-body h2 { font-size: 1.2em; }
        .markdown-body h3 { font-size: 1.1em; }
        .markdown-body strong { font-weight: 600; color: inherit; }
        .markdown-body em { font-style: italic; }
        .markdown-body ul, .markdown-body ol { padding-left: 20px; margin: 0 0 10px 0; }
        .markdown-body li + li { margin-top: 4px; }
        .markdown-body blockquote {
            padding: 4px 12px;
            color: var(--text-muted);
            border-left: 3px solid var(--accent);
            margin: 0 0 10px 0;
            background: rgba(255,255,255,0.05);
            border-radius: 0 4px 4px 0;
        }
        .markdown-body code {
            padding: 2px 4px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 0.9em;
            color: #ff7b72;
        }
        .markdown-body pre {
            background: #1e1e1e !important;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .markdown-body pre code {
            background: none;
            padding: 0;
            color: inherit;
            border-radius: 0;
            font-size: 0.85em;
        }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .markdown-body th, .markdown-body td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 12px;
        }
        .markdown-body th { background: rgba(255,255,255,0.05); }

        /* ===== 打字指示器动画 ===== */
        .typing-indicator {
            display: inline-flex;
            align-items: center;
        }
        .icon-btn:hover {
            background: rgba(124,58,237,0.2);
            border-color: var(--accent);
            color: var(--accent-light);
            transform: scale(1.05);
        }

        /* ===== 欢迎引导区（无消息时显示） ===== */
        .welcome-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px;
            text-align: center;
            animation: fadeUp 0.5s ease both;
        }
        .welcome-screen.visible { display: flex; }
        .welcome-icon {
            font-size: 3.5rem;
            filter: drop-shadow(0 4px 16px var(--accent-glow));
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-10px); }
        }
        .welcome-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }
        .welcome-sub {
            font-size: 0.9rem;
            color: var(--text-secondary);
            max-width: 340px;
            line-height: 1.6;
        }
        .quick-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }
        .quick-prompt-btn {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(124,58,237,0.12);
            border: 1px solid rgba(124,58,237,0.3);
            color: var(--accent-light);
            font-size: 0.82rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .quick-prompt-btn:hover {
            background: rgba(124,58,237,0.25);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* ===== 聊天历史区 ===== */
        .chat-history {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-history::-webkit-scrollbar { width: 5px; }
        .chat-history::-webkit-scrollbar-track { background: transparent; }
        .chat-history::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        /* ===== 消息行（含头像） ===== */
        .message-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            animation: fadeUp 0.35s cubic-bezier(0.34, 1.2, 0.64, 1) both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .message-row.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .msg-avatar.ai-avatar {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            box-shadow: 0 3px 10px var(--accent-glow);
        }
        .msg-avatar.user-avatar {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            box-shadow: 0 3px 10px rgba(14,165,233,0.35);
        }

        .msg-body { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
        .message-row.user .msg-body { align-items: flex-end; }

        .msg-name {
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            padding: 0 4px;
        }

        /* ===== 消息气泡 ===== */
        .message {
            padding: 12px 16px;
            border-radius: var(--radius-msg);
            line-height: 1.65;
            font-size: 0.92rem;
            word-break: break-word;
            position: relative;
            transition: var(--transition);
        }
        .message:hover { transform: scale(1.01); }

        .user-message {
            background: linear-gradient(135deg, var(--user-msg-from), var(--user-msg-to));
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(79,70,229,0.35);
        }
        .ai-message {
            background: var(--ai-msg-bg);
            color: var(--text-primary);
            border: 1px solid var(--ai-msg-border);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(8px);
        }

        /* 消息时间戳 */
        .msg-time {
            font-size: 0.68rem;
            color: var(--text-muted);
            padding: 0 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message-row:hover .msg-time { opacity: 1; }

        /* ===== 打字动效 (三点跳动) ===== */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
        }
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-light);
            animation: typingBounce 1.4s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30%            { transform: translateY(-8px); opacity: 1; }
        }

        /* ===== 分割线（日期提示） ===== */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.72rem;
        }
        .date-divider::before, .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
        }

        /* ===== 输入区 ===== */
        .input-area {
            padding: 16px 20px 20px;
            background: rgba(255,255,255,0.03);
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        textarea#userInput {
            width: 100%;
            min-height: 46px;
            max-height: 130px;
            padding: 12px 48px 12px 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: var(--transition);
            backdrop-filter: blur(8px);
            overflow-y: hidden;
        }
        textarea#userInput::placeholder { color: var(--text-muted); }
        textarea#userInput:focus {
            border-color: var(--input-focus-border);
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .char-counter {
            position: absolute;
            right: 12px;
            bottom: 10px;
            font-size: 0.68rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }
        .char-counter.warning { color: #f59e0b; }
        .char-counter.danger  { color: #ef4444; }

        /* ===== 发送按钮 ===== */
        #sendBtn {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--user-msg-from), var(--user-msg-to));
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: var(--transition);
            box-shadow: 0 4px 15px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }
        #sendBtn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
            border-radius: inherit;
        }
        #sendBtn:hover:not(:disabled) {
            transform: scale(1.08) translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }
        #sendBtn:active:not(:disabled) { transform: scale(0.96); }
        #sendBtn:hover:not(:disabled)::after { background: rgba(255,255,255,0.1); }
        #sendBtn:disabled {
            background: rgba(100,116,139,0.3);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 联网按钮 ===== */
        #searchToggleBtn {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            border: 1.5px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
            transition: var(--transition);
            position: relative;
        }
        #searchToggleBtn:hover {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        #searchToggleBtn.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #34d399;
            box-shadow: 0 0 12px rgba(16,185,129,0.3);
        }
        #searchToggleBtn.active::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 18px;
            border: 2px solid rgba(16,185,129,0.4);
            animation: searchPulse 2s ease-in-out infinite;
        }
        @keyframes searchPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(1.08); }
        }
        /* 联网模式横幅 */
        .search-mode-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            font-size: 0.78rem;
            color: #6ee7b7;
            animation: fadeUp 0.25s ease both;
        }
        .search-mode-banner.visible { display: flex; }
        .search-mode-banner-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: pulse-dot 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }
        .search-mode-banner-close {
            margin-left: auto;
            cursor: pointer;
            opacity: 0.6;
            font-size: 0.85rem;

            background: none;
            border: none;
            color: inherit;
            padding: 0 2px;
            line-height: 1;
        }
        .search-mode-banner-close:hover { opacity: 1; }

        /* ===== 输入区提示行 ===== */
        .input-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .input-hint kbd {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            font-family: inherit;
            font-size: 0.68rem;
            color: var(--text-secondary);
        }

        /* ===== 复制按钮（AI消息hover显示） ===== */
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-secondary);
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .ai-message:hover .copy-btn { opacity: 1; }
        .copy-btn:hover {
            background: rgba(124,58,237,0.25);
            color: var(--accent-light);
        }
        .copy-btn.copied { color: #22c55e; border-color: #22c55e; }

        /* ===== AI 消息操作栏（气泡下方）===== */
        .msg-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            transform: translateY(-2px);
            margin-top: 4px;
            padding-left: 2px;
        }
        .message-row.ai:hover .msg-actions {
            opacity: 1;
            transform: translateY(0);
        }
        .msg-action-btn {
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: var(--text-secondary);

            font-family: 'Inter', sans-serif;

            background: rgba(124,58,237,0.25);
            color: var(--accent-light);
        }
        .msg-action-btn.copied { color: #22c55e; border-color: #22c55e; }

        /* ===== 导出下拉面板 ===== */
        .export-dropdown {
            position: absolute;
            top: 34px;
            right: 0;
            background: rgba(20, 16, 40, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            z-index: 100;
            min-width: 140px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            animation: fadeUp 0.18s ease both;
        }
        .export-dropdown.open { display: flex; }
        .export-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: none;
            font-family: 'Inter', sans-serif;
            width: 100%;
            text-align: left;
        }
        .export-option:hover {
            background: rgba(124,58,237,0.18);
            color: var(--text-primary);
        }
        .export-option-icon { font-size: 1rem; flex-shrink: 0; }
        .export-option-label { display: flex; flex-direction: column; gap: 1px; }
        .export-option-name { font-weight: 500; font-size: 0.8rem; }
        .export-option-ext  { font-size: 0.68rem; color: var(--text-muted); }

        /* ===== 工具调用卡片（搜索过程展示）===== */
        .tool-card {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.07);
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-size: 0.8rem;
            color: #6ee7b7;
            animation: fadeUp 0.3s ease both;
            max-width: 78%;
            margin-left: 42px; /* 对齐 ai 头像宽度 */
        }
        .tool-card-icon {
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .tool-card-body { display: flex; flex-direction: column; gap: 3px; }
        .tool-card-label {
            font-weight: 600;
            font-size: 0.75rem;
            color: #34d399;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }
        .tool-card-query {
            color: #a7f3d0;
            font-size: 0.82rem;
            word-break: break-all;
        }
        .tool-card-spinner {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid rgba(52, 211, 153, 0.3);
            border-top-color: #34d399;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tool-card.done .tool-card-spinner { display: none; }
        .tool-card.done { background: rgba(16, 185, 129, 0.04); border-color: rgba(16, 185, 129, 0.12); }
        .tool-card.done .tool-card-label { color: #6ee7b7; }

        /* ===== 自定义弹窗 ===== */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 8, 24, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .custom-modal-overlay.show { display: flex; opacity: 1; }
        .custom-modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 320px;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: scale(0.95);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .custom-modal-overlay.show .custom-modal-box { transform: scale(1); }
        .custom-modal-header {
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .custom-modal-body {
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .custom-modal-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            margin-top: 10px;
            outline: none;
            transition: var(--transition);
            box-sizing: border-box;
        }
        .custom-modal-input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 0 3px rgba(110, 114, 255, 0.2);
        }
        .custom-modal-footer {
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .modal-btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }
        .modal-btn-cancel { background: rgba(255, 255, 255, 0.1); color: var(--text-primary); }
        .modal-btn-cancel:hover { background: rgba(255, 255, 255, 0.15); }
        .modal-btn-confirm { background: linear-gradient(135deg, var(--user-msg-from), var(--user-msg-to)); color: white; }
        .modal-btn-confirm:hover { filter: brightness(1.1); box-shadow: 0 2px 10px var(--accent-glow); }
        .modal-btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; }
        .modal-btn-danger:hover { filter: brightness(1.1); box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4); }

        /* ===== 响应式 ===== */
        @media (max-width: 760px) {
            .app-wrapper { max-width: 100vw; width: 100vw; height: 100vh; max-height: none; gap: 0; }
            .chat-container { border-radius: 0; }
            .sidebar {
                position: fixed;
                top: 0; left: 0;
                z-index: 100;
                height: 100vh;
                border-radius: 0;
            }
            .sidebar.collapsed { transform: translateX(-100%); width: 260px; min-width: 260px; opacity: 1; }
            .msg-body { max-width: 88%; }
            .tool-card { margin-left: 0; max-width: 92%; }
        }
    </style>
</head>
<body>

<div class="bg-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<!-- 应用外层包裹 -->
<div class="app-wrapper" id="appWrapper">

<!-- 自定义弹窗 (Modal) -->
<div class="custom-modal-overlay" id="customModal">
    <div class="custom-modal-box">
        <div class="custom-modal-header" id="modalTitle">提示</div>
        <div class="custom-modal-body" id="modalBody"></div>
        <div class="custom-modal-footer">
            <button class="modal-btn modal-btn-cancel" id="modalCancelBtn">取消</button>
            <button class="modal-btn modal-btn-confirm" id="modalConfirmBtn">确定</button>

</div>

<!-- 侧边栏：历史会话列表 -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo">🐱 LongCat 历史</div>
        <button class="new-chat-btn" id="newChatBtn" onclick="newChat()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            新建对话
        </button>
    </div>
    <div class="sidebar-list" id="sessionList">
        <div class="sidebar-empty">暂无历史记录<br>发送消息后自动保存</div>
    </div>
    <div class="sidebar-footer">数据存储在本地 SQLite</div>
</div>

<div class="chat-container" id="chatContainer">

    <!-- 顶部标题栏 -->
    <div class="chat-header">
        <button class="icon-btn" id="sidebarToggle" onclick="toggleSidebar()" title="展开/收起历史">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <line x1="9" y1="3" x2="9" y2="21"/>
            </svg>
        </button>
        <div class="header-avatar">🐱</div>
        <div class="header-info">
            <div class="header-title">LongCat-2.0 智能助手</div>
            <div class="header-status">
                <span class="status-dot"></span>
                <span id="statusText">在线 · 随时为你解答</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="stopBtn" title="停止生成" onclick="stopGenerating()" style="display:none">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            </button>
            <button class="icon-btn" id="clearBtn" title="清空对话" onclick="clearChat()">🗑️</button>

    <!-- 聊天记录区 -->
    <div class="chat-history" id="chatHistory">

        <!-- 欢迎引导（有消息时隐藏） -->
        <div class="welcome-screen visible" id="welcomeScreen">
            <div class="welcome-icon">🤖</div>
            <div class="welcome-title">你好，我是 LongCat！</div>
            <div class="welcome-sub">我是基于 LongCat-2.0 的智能对话助手，可以帮你解答问题、撰写内容、分析数据。</div>
            <div class="quick-prompts" id="quickPrompts">
                <button class="quick-prompt-btn" onclick="usePrompt('介绍一下你自己')">👋 介绍一下你自己</button>
                <button class="quick-prompt-btn" onclick="usePrompt('帮我写一段 Python 代码，实现快速排序')">💻 写一段快速排序代码</button>
                <button class="quick-prompt-btn" onclick="usePrompt('今天的天气怎么样？')">🌤️ 今天的天气</button>
                <button class="quick-prompt-btn" onclick="usePrompt('给我讲一个有趣的故事')">📖 讲一个故事</button>
            </div>
        </div>

        <!-- 日期分割线 -->
        <div class="date-divider" id="dateDivider" style="display:none">
            <span id="dateText"></span>
        </div>

    </div>

    <!-- 输入区 -->
    <div class="input-area">
        <!-- 联网模式横幅 -->
        <div class="search-mode-banner" id="searchModeBanner">
            <span class="search-mode-banner-dot"></span>
            <span>🌐 联网模式已开启 · 每次发送都会搜索互联网获取最新信息</span>
            <button class="search-mode-banner-close" onclick="toggleSearch()" title="关闭联网">✕</button>
        </div>
        <div class="input-row">
            <!-- 联网切换按钮 -->
            <button id="searchToggleBtn" onclick="toggleSearch()" title="切换联网搜索模式">
                🌐
            </button>
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="输入你想说的话..." autocomplete="off" rows="1"></textarea>
                <span class="char-counter" id="charCounter">0</span>
            </div>
            <button id="sendBtn" onclick="sendMessage()" title="发送消息 (Enter)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>

        <div class="input-hint">
            <kbd>Enter</kbd> 发送 &nbsp;·&nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行
        </div>
    </div>

</div><!-- /.chat-container -->

</div><!-- /.app(smith)-wrapper -->

<script>
    // ===== DOM 引用 =====
    const userInput   = document.getElementById('userInput');
    const sendBtn     = document.getElementById('sendBtn');
    const chatHistory = document.getElementById('chatHistory');
    const charCounter = document.getElementById('charCounter');
    const statusText  = document.getElementById('statusText');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const dateDivider   = document.getElementById('dateDivider');
    const dateText      = document.getElementById('dateText');

    // ===== 初始化 Markdown 解析器 =====
    marked.setOptions({
        highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
        },
        breaks: true, // 支持 GitHub 风格的换行
        gfm: true
    });

    const MAX_CHARS = 2000;
    let messageCount = 0;
    let isTyping = false;
    const generatingSessions = new Set();
    const abortControllers = new Map();
    let searchEnabled = false;

    function updateInputState() {
        const isGen = generatingSessions.has(SESSION_ID);
        isTyping = isGen;
        sendBtn.disabled = isGen;
        userInput.disabled = isGen;
        stopBtn.style.display = isGen ? '' : 'none';
        statusText.textContent = isGen ? '正在思考中...' : '在线 · 随时为你解答';
    }

    // ===== Session ID（存入 localStorage，刷新不丢失）=====
    let SESSION_ID = localStorage.getItem('lc_session_id');
    if (!SESSION_ID) {
        SESSION_ID = 'sess_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        localStorage.setItem('lc_session_id', SESSION_ID);
    }

    // ===== 侧边栏开关 =====
    const sidebar = document.getElementById('sidebar');
    let sidebarOpen = true;

    function toggleSidebar() {
        sidebarOpen = !sidebarOpen;
        sidebar.classList.toggle('collapsed', !sidebarOpen);
        if (sidebarOpen) loadSessions();
    }

    // ===== 自定义弹窗逻辑 =====
    function showModal(title, htmlContent, confirmText, confirmClass, onConfirm) {
        const overlay = document.getElementById('customModal');
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalBody').innerHTML = htmlContent;
        
        const confirmBtn = document.getElementById('modalConfirmBtn');
        confirmBtn.textContent = confirmText;
        confirmBtn.className = 'modal-btn ' + confirmClass;
        
        const cancelBtn = document.getElementById('modalCancelBtn');
        
        function close() {
            overlay.classList.remove('show');
            setTimeout(() => { overlay.style.display = 'none'; }, 200);
        }
        
        overlay.style.display = 'flex';
        overlay.offsetHeight; // force reflow
        overlay.classList.add('show');
        
        confirmBtn.onclick = () => {
            if (onConfirm() !== false) close();
        };
        cancelBtn.onclick = close;
        
        const input = document.getElementById('modalInput');
        if (input) {
            input.focus();
            input.selectionStart = input.selectionEnd = input.value.length;
            input.onkeydown = (e) => {
                if (e.key === 'Enter') confirmBtn.click();
                if (e.key === 'Escape') cancelBtn.click();
            }
        }
    }

    // ===== 新建对话 =====
    function newChat() {
        SESSION_ID = 'sess_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        localStorage.setItem('lc_session_id', SESSION_ID);
        document.querySelectorAll('.message-row, .tool-card').forEach(r => r.style.display = 'none');
        messageCount = 0;
        welcomeScreen.classList.add('visible');
        document.querySelector('.header-title').textContent = 'LongCat-2.0 智能助手';
        updateInputState();
        userInput.focus();
        loadSessions();
    }

    // ===== 会话列表 =====
    const sessionList = document.getElementById('sessionList');

    function timeAgo(dateStr) {
        const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
        const diff = (Date.now() - d.getTime()) / 1000;
        if (diff < 60)     return '刚刚';
        if (diff < 3600)   return Math.floor(diff / 60) + '分钟前';
        if (diff < 86400)  return Math.floor(diff / 3600) + '小时前';
        if (diff < 604800) return Math.floor(diff / 86400) + '天前';
        return d.toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
    }

    async function loadSessions() {
        try {
            const res = await fetch('/api/sessions');
            const sessions = await res.json();
            if (!sessions.length) {
                sessionList.innerHTML = '<div class="sidebar-empty">暂无历史记录<br>发送消息后自动保存</div>';
                return;
            }
            sessionList.innerHTML = '';
            sessions.forEach(s => {
                const item = document.createElement('div');
                item.className = 'session-item' + (s.session_id === SESSION_ID ? ' active' : '');
                item.dataset.sid = s.session_id;

                // 主内容区域
                const inner = document.createElement('span');
                inner.className = 'session-icon';
                inner.textContent = '💬';
                item.appendChild(inner);

                const info = document.createElement('div');
                info.className = 'session-info';
                info.innerHTML = `<div class="session-title">${escapeHtml(s.title)}</div>
                    <div class="session-meta">${timeAgo(s.updated_at)} · ${s.message_count}条</div>`;
                item.appendChild(info);

                // ⋯ 操作按钮 + 下拉菜单
                const menuWrap = document.createElement('div');
                menuWrap.style.cssText = 'position:relative;flex-shrink:0';

                const menuBtn = document.createElement('button');
                menuBtn.className = 'session-menu-btn';
                menuBtn.textContent = '⋯';
                menuBtn.title = '更多操作';

                const dd = document.createElement('div');
                dd.className = 'session-menu-dropdown';

                menuBtn.onclick = (e) => {
                    e.stopPropagation();
                    document.querySelectorAll('.session-menu-dropdown.open').forEach(el => {
                        if (el !== dd) el.classList.remove('open');
                    });
                    dd.classList.toggle('open');
                };

                const renOpt = document.createElement('button');
                renOpt.className = 'session-menu-opt';
                renOpt.innerHTML = '✏️ 重命名';
                renOpt.onclick = (e) => { 
                    e.stopPropagation(); 
                    dd.classList.remove('open'); 
                    openRenameModal(s.session_id, s.title); 
                };

                const delOpt = document.createElement('button');
                delOpt.className = 'session-menu-opt danger';
                delOpt.innerHTML = '🗑️ 删除';
                delOpt.onclick = (e) => { e.stopPropagation(); dd.classList.remove('open'); deleteSession(e, s.session_id); };

                dd.appendChild(renOpt);
                dd.appendChild(delOpt);
                menuWrap.appendChild(menuBtn);
                menuWrap.appendChild(dd);
                item.appendChild(menuWrap);

                item.addEventListener('click', () => switchSession(s.session_id, s.title));
                sessionList.appendChild(item);
            });
        } catch (e) {
            console.error('[loadSessions]', e);
        }
    }

    // ===== 重命名会话 (弹窗) =====
    function openRenameModal(sid, currentTitle) {
        const html = `请输入新的会话名称：<br><input type="text" id="modalInput" class="custom-modal-input" value="${escapeHtml(currentTitle)}">`;
        showModal('重命名会话', html, '保存', 'modal-btn-confirm', () => {
            const inputEl = document.getElementById('modalInput');
            if (!inputEl) return true;
            const newTitle = inputEl.value.trim().slice(0, 50);
            if (!newTitle || newTitle === currentTitle) return true;
            
            // 乐观更新 UI
            const item = document.querySelector(`.session-item[data-sid="${sid}"] .session-title`);
            if (item) item.textContent = newTitle;
            if (sid === SESSION_ID) document.querySelector('.header-title').textContent = newTitle;

            fetch(`/api/sessions/${sid}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: newTitle })
            }).then(() => loadSessions()).catch(e => console.error(e));
            
            return true;
        });
    }

    // ===== 切换历史会话 =====
    async function switchSession(sid, title) {
        SESSION_ID = sid;
        localStorage.setItem('lc_session_id', sid);

        document.querySelectorAll('.message-row, .tool-card').forEach(r => r.style.display = 'none');
        document.querySelector('.header-title').textContent = title || 'LongCat-2.0 智能助手';
        updateInputState();

        const existing = document.querySelectorAll(`[data-session-id="${sid}"]`);
        if (existing.length > 0) {
            existing.forEach(r => r.style.display = '');
            welcomeScreen.classList.toggle('visible', existing.length === 0);
            setTimeout(() => { scrollToBottom(true); }, 10);
            loadSessions();
            return;
        }

        messageCount = 0;
        welcomeScreen.classList.add('visible');

        try {
            statusText.textContent = '加载历史中...';
            const res  = await fetch(`/api/sessions/${sid}/messages`);
            if (!res.ok) throw new Error('API error');
            const msgs = await res.json();

            if (msgs.length === 0) {
                welcomeScreen.classList.add('visible');
            } else {
                welcomeScreen.classList.remove('visible');
                msgs.forEach(m => {
                    const role = m.role === 'user' ? 'user' : 'ai';
                    const node = appendMessage(m.content, role, sid);
                    if (role === 'ai') {
                        node.innerHTML = marked.parse(m.content);
                        node.classList.add('markdown-body');
                    } else {
                        node.textContent = m.content;
                    }
                });
                scrollToBottom(true);
            }
        } catch (e) {
            console.error('[switchSession]', e);
            statusText.textContent = '加载失败，请重试';
        } finally {
            if (sid === SESSION_ID && !generatingSessions.has(sid)) {
                setTimeout(() => { statusText.textContent = '在线 · 随时为你解答'; }, 1200);
            }
        }
        loadSessions();   // 更新活跃高亮
    }

    // ===== 删除会话 =====
    function deleteSession(e, sid) {
        e.stopPropagation();
        showModal('删除会话', '确定要彻底删除这个对话吗？此操作无法恢复。', '彻底删除', 'modal-btn-danger', async () => {
            await fetch(`/api/sessions/${sid}`, { method: 'DELETE' });
            document.querySelectorAll(`[data-session-id="${sid}"]`).forEach(r => r.remove());
            if (sid === SESSION_ID) newChat();
            else loadSessions();
        });
    }

    // 页面加载时初始化侧边栏
    loadSessions();

    // ===== 联网模式切换 =====
    const searchToggleBtn  = document.getElementById('searchToggleBtn');
    const searchModeBanner = document.getElementById('searchModeBanner');

    function toggleSearch() {
        searchEnabled = !searchEnabled;
        searchToggleBtn.classList.toggle('active', searchEnabled);
        searchModeBanner.classList.toggle('visible', searchEnabled);
        searchToggleBtn.title = searchEnabled ? '关闭联网搜索' : '开启联网搜索';
        userInput.placeholder = searchEnabled
            ? '联网模式：输入问题，自动搜索互联网...'
            : '输入你想说的话...';
        userInput.focus();
    }

    // ===== 初始化日期 =====
    function initDateDivider() {
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
        dateText.textContent = now.toLocaleDateString('zh-CN', options);
        dateDivider.style.display = 'flex';
    }
    initDateDivider();

    // ===== 自动调整 textarea 高度 =====
    userInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 130) + 'px';

        // 字符计数器
        const len = this.value.length;
        charCounter.textContent = len > 0 ? len : '';
        charCounter.className = 'char-counter';
        if (len > MAX_CHARS * 0.85) charCounter.classList.add('warning');
        if (len > MAX_CHARS * 0.95) { charCounter.classList.remove('warning'); charCounter.classList.add('danger'); }
    });

    // ===== 键盘事件：Enter 发送 / Shift+Enter 换行 =====
    userInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ===== 快捷提示按钮 =====
    function usePrompt(text) {
        userInput.value = text;
        userInput.dispatchEvent(new Event('input'));
        userInput.focus();
        sendMessage();
    }

    // ===== 获取当前时间字符串 =====
    function getTimeStr() {
        return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    // ===== 添加消息行 =====
    function appendMessage(text, role, sid = SESSION_ID) {
        messageCount++;

        const isUser = role === 'user';
        const row = document.createElement('div');
        row.className = `message-row ${isUser ? 'user' : 'ai'}`;
        row.dataset.sessionId = sid;
        if (sid !== SESSION_ID) row.style.display = 'none';
        row.style.animationDelay = '0ms';

        const avatar = document.createElement('div');
        avatar.className = `msg-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}`;
        avatar.textContent = isUser ? '👤' : '🐱';

        const body = document.createElement('div');
        body.className = 'msg-body';

        const name = document.createElement('div');
        name.className = 'msg-name';
        name.textContent = isUser ? '你' : 'LongCat';

        const bubble = document.createElement('div');
        bubble.className = `message ${isUser ? 'user-message' : 'ai-message'}`;

        let actions = null;   // 操作栏（仅 AI 消息使用）
        if (!isUser) {
            // ── 操作栏（复制 + 导出）──
            actions = document.createElement('div');
            actions.className = 'msg-actions';

            // 复制按钮
            const copyBtn = document.createElement('button');
            copyBtn.className = 'msg-action-btn';
            copyBtn.textContent = '复制';
            copyBtn.onclick = () => {
                const rawText = textNode.dataset.raw || textNode.textContent;
                copyText(rawText, copyBtn);
            };
            actions.appendChild(copyBtn);

            // 导出按钮 + 下拉面板
            const exportWrapper = document.createElement('div');
            exportWrapper.style.position = 'relative';

            const exportBtn = document.createElement('button');
            exportBtn.className = 'msg-action-btn';
            exportBtn.textContent = '📄 下载';
            exportBtn.onclick = (e) => {
                e.stopPropagation();
                const dd = exportWrapper.querySelector('.export-dropdown');
                // 关闭其他所有下拉
                document.querySelectorAll('.export-dropdown.open').forEach(el => {
                    if (el !== dd) el.classList.remove('open');
                });
                dd.classList.toggle('open');
            };

            const dropdown = document.createElement('div');
            dropdown.className = 'export-dropdown';

            const formats = [
                { icon: '📝', name: 'Markdown', ext: '.md',   type: 'md'   },
                { icon: '📋', name: '纯文本',   ext: '.txt',  type: 'txt'  },
                { icon: '📄', name: 'Word 文档', ext: '.docx', type: 'docx' },
            ];

            formats.forEach(fmt => {
                const opt = document.createElement('button');
                opt.className = 'export-option';
                opt.innerHTML = `
                    <span class="export-option-icon">${fmt.icon}</span>
                    <span class="export-option-label">
                        <span class="export-option-name">${fmt.name}</span>
                        <span class="export-option-ext">${fmt.ext}</span>
                    </span>`;
                opt.onclick = () => {
                    dropdown.classList.remove('open');
                    const rawText = textNode.dataset.raw || textNode.textContent;
                    exportMessage(rawText, fmt.type);
                };
                dropdown.appendChild(opt);
            });

            exportWrapper.appendChild(exportBtn);
            exportWrapper.appendChild(dropdown);
            actions.appendChild(exportWrapper);
        }

        const textNode = document.createElement('span');
        textNode.className = 'msg-text';
        bubble.appendChild(textNode);

        const timeEl = document.createElement('div');
        timeEl.className = 'msg-time';
        timeEl.textContent = getTimeStr();

        body.appendChild(name);
        body.appendChild(bubble);
        if (!isUser) body.appendChild(actions);  // 操作栏在气泡下方
        body.appendChild(timeEl);
        row.appendChild(avatar);
        row.appendChild(body);
        chatHistory.appendChild(row);

        if (sid === SESSION_ID) {
            welcomeScreen.classList.remove('visible');
            scrollToBottom(true);
        }
        return textNode;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ===== 添加"思考中"动画 =====
    function addTypingIndicator(sid = SESSION_ID) {
        const row = document.createElement('div');
        row.className = 'message-row ai';
        row.id = 'typingRow_' + sid;
        row.dataset.sessionId = sid;
        if (sid !== SESSION_ID) row.style.display = 'none';

        const avatar = document.createElement('div');
        avatar.className = 'msg-avatar ai-avatar';
        avatar.textContent = '🐱';

        const body = document.createElement('div');
        body.className = 'msg-body';

        const bubble = document.createElement('div');
        bubble.className = 'message ai-message';

        const indicator = document.createElement('div');
        indicator.className = 'typing-indicator';
        for (let i = 0; i < 3; i++) {
            const dot = document.createElement('div');
            dot.className = 'typing-dot';
            indicator.appendChild(dot);
        }
        bubble.appendChild(indicator);
        body.appendChild(bubble);
        row.appendChild(avatar);
        row.appendChild(body);
        chatHistory.appendChild(row);
        if (sid === SESSION_ID) scrollToBottom(true);
    }

    function removeTypingIndicator(sid = SESSION_ID) {
        const row = document.getElementById('typingRow_' + sid);
        if (row) row.remove();
    }

    // ===== 复制文本 =====
    function copyText(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            btn.textContent = '✓ 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '复制';
                btn.classList.remove('copied');
            }, 2000);
        });
    }

    // ===== 文档导出 =====
    async function exportMessage(text, format) {
        // 生成默认文件名（取内容前 20 个非空字符）
        const defaultName = text.replace(/[#*`>\-\n]/g, '').trim().slice(0, 20) || 'LongCat文档';

        if (format === 'txt') {
            clientDownload(text, `${defaultName}.txt`, 'text/plain;charset=utf-8');
            return;
        }
        if (format === 'md') {
            clientDownload(text, `${defaultName}.md`, 'text/markdown;charset=utf-8');
            return;
        }
        if (format === 'docx') {
            // 调用后端生成 Word 文档
            try {
                statusText.textContent = '📄 正在生成 Word 文档...';
                const resp = await fetch('/api/export-docx', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text, filename: defaultName })
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    alert('导出失败：' + (err.error || '未知错误'));
                    return;
                }
                // 触发文件下载
                const blob = await resp.blob();
                const url  = URL.createObjectURL(blob);
                const a    = document.createElement('a');
                a.href     = url;
                a.download = `${defaultName}.docx`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                alert('导出失败，请检查服务是否运行');
            } finally {
                statusText.textContent = '在线 · 随时为你解答';
            }
        }
    }

    // 客户端直接下载纯文本文件
    function clientDownload(content, filename, mime) {
        const blob = new Blob([content], { type: mime });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    // 点击空白处关闭所有下拉面板
    document.addEventListener('click', () => {
        document.querySelectorAll('.export-dropdown.open, .session-menu-dropdown.open')
                .forEach(el => el.classList.remove('open'));
    });

    // ===== 滚动到底部 =====
    function scrollToBottom(force = false) {
        // 允许 150px 的容差；如果距离底部足够近，或者强制滚动，则执行滚动
        const isAtBottom = chatHistory.scrollHeight - chatHistory.scrollTop - chatHistory.clientHeight < 150;
        if (force || isAtBottom) {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    }

    // ===== 渲染工具调用卡片（搜索过程展示）=====
    function appendToolCard(toolName, query, sid = SESSION_ID) {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.id = 'toolCard_' + Date.now();
        card.dataset.sessionId = sid;
        if (sid !== SESSION_ID) card.style.display = 'none';

        const iconMap = { 'web_search': '🔍', 'default': '⚙️' };
        const labelMap = { 'web_search': '正在网络搜索', 'default': '调用工具' };
        const icon = iconMap[toolName] || iconMap['default'];
        const label = labelMap[toolName] || labelMap['default'];

        card.innerHTML = `
            <div class="tool-card-icon">${icon}</div>
            <div class="tool-card-body">
                <div class="tool-card-label">
                    <span class="tool-card-spinner"></span>${label}...
                </div>
                <div class="tool-card-query">${escapeHtml(query)}</div>
            </div>
        `;
        chatHistory.appendChild(card);
        if (sid === SESSION_ID) scrollToBottom(true);
        return card;
    }

    // 将已完成的工具卡片标记为 done
    function markToolCardDone(card) {
        if (card) {
            card.classList.add('done');
            card.querySelector('.tool-card-label').textContent = '✓ 搜索完成';
        }
    }

    // 移除所有工具卡片
    function removeAllToolCards(sid = SESSION_ID) {
        chatHistory.querySelectorAll(`.tool-card[data-session-id="${sid}"]`).forEach(c => c.remove());
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ===== 清空对话 =====
    function clearChat() {
        showModal('清空对话', '确定要清空当前会话的所有历史记录吗？', '确认清空', 'modal-btn-danger', () => {
            // 移除当前会话的消息行
            document.querySelectorAll(`.message-row[data-session-id="${SESSION_ID}"], .tool-card[data-session-id="${SESSION_ID}"]`).forEach(r => r.remove());
            messageCount = 0;
            welcomeScreen.classList.add('visible');
            if (!generatingSessions.has(SESSION_ID)) {
                statusText.textContent = '在线 · 随时为你解答';
            }
        });
    }

    // ===== 停止生成 =====
    function stopGenerating() {
        if (abortControllers.has(SESSION_ID)) {
            abortControllers.get(SESSION_ID).abort();
        }
    }

    // ===== 发送消息主逻辑 =====
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text || generatingSessions.has(SESSION_ID)) return;

        if (text.length > MAX_CHARS) {
            alert(`消息过长！最多支持 ${MAX_CHARS} 个字符。`);
            return;
        }

        const sid = SESSION_ID;
        generatingSessions.add(sid);
        updateInputState();

        const userTextNode = appendMessage(text, 'user', sid);
        userTextNode.textContent = text;
        userInput.value = '';
        userInput.style.height = 'auto';
        charCounter.textContent = '';

        addTypingIndicator(sid);

        const controller = new AbortController();
        abortControllers.set(sid, controller);
        const timeoutId = setTimeout(() => controller.abort(), 120_000);

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                signal: controller.signal,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message:        text,
                    session_id:     sid,
                    search_enabled: searchEnabled
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error || 'Server error');
            }

            removeTypingIndicator(sid);
            const aiTextNode = appendMessage('', 'ai', sid);
            aiTextNode.classList.add('markdown-body');
            let fullReply = '';

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop(); // 保留不完整的行

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const dataStr = line.slice(6);
                        if (!dataStr) continue;

                        try {
                            const data = JSON.parse(dataStr);
                            if (data.type === 'tool') {
                                if (sid === SESSION_ID) statusText.textContent = '🔍 网络搜索中...';
                                const card = appendToolCard(data.tool, data.input, sid);
                                await sleep(500);
                                markToolCardDone(card);
                                setTimeout(() => {
                                    card.style.transition = 'opacity 0.3s';
                                    card.style.opacity = '0';
                                    setTimeout(() => card.remove(), 300);
                                }, 1000);
                            } else if (data.type === 'chunk') {
                                if (sid === SESSION_ID) statusText.textContent = '正在输出...';
                                fullReply += data.content;
                                aiTextNode.dataset.raw = fullReply;
                                aiTextNode.innerHTML = marked.parse(fullReply);
                                if (sid === SESSION_ID) scrollToBottom(false);
                            } else if (data.type === 'error') {
                                aiTextNode.textContent = `⚠️ 错误: ${data.error}`;
                            } else if (data.type === 'done') {
                                loadSessions();
                            }
                        } catch (e) {
                            console.error('Error parsing SSE:', e);
                        }
                    }
                }
            }
            clearTimeout(timeoutId);
        } catch (err) {
            clearTimeout(timeoutId);
            removeTypingIndicator(sid);
            removeAllToolCards(sid);
            if (err.name !== 'AbortError') {
                const node = appendMessage('', 'ai', sid);
                node.textContent = '🔌 网络连接失败，请检查后端服务是否正常运行。';
            }
            // AbortError = 用户主动停止，静默处理
        } finally {
            generatingSessions.delete(sid);
            abortControllers.delete(sid);
            if (sid === SESSION_ID) {
                updateInputState();
                userInput.focus();
            }
        }
    }
</script>
