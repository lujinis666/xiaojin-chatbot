<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小进后台管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/favicon.png?v=2">
    <style>
        /* ============================================================
           Admin Panel — Premium Green Theme
           ============================================================ */
        :root {
            --primary: #10a37f;
            --primary-light: #1bc8a0;
            --primary-dark: #0d8a6a;
            --primary-glow: rgba(16, 163, 127, 0.18);

            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --surface: #f0f4f2;
            --hover-bg: #e8eeeb;

            --text-1: #111827;
            --text-2: #6b7280;
            --text-3: #9ca3af;
            --border: #e5e7eb;
            --border-light: #f0f0f0;

            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;
            --warning-light: rgba(245, 158, 11, 0.1);
            --info: #3b82f6;
            --info-light: rgba(59, 130, 246, 0.1);
            --purple: #8b5cf6;
            --purple-light: rgba(139, 92, 246, 0.1);

            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
            --transition: 200ms ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-1);
            min-height: 100vh;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(16,163,127,0.25); border-radius: 3px; }

        /* ── Loading Screen ── */
        .admin-loading {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; transition: opacity 0.4s;
        }
        .admin-loading.hide { opacity: 0; pointer-events: none; }
        .admin-loading .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Toast Notification ── */
        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            display: flex; flex-direction: column; gap: 8px;
        }
        .toast {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            font-size: 14px; font-weight: 500;
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.35s;
            max-width: 380px;
        }
        .toast.show { transform: translateX(0); }
        .toast.hide { opacity: 0; transform: translateX(120%); }
        .toast-icon { font-size: 18px; flex-shrink: 0; }
        .toast-success { border-left: 3px solid var(--primary); }
        .toast-error { border-left: 3px solid var(--danger); }
        .toast-warning { border-left: 3px solid var(--warning); }
        .toast-info { border-left: 3px solid var(--info); }

        /* ── Confirm Modal ── */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.35);
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 90%; max-width: 440px;
            transform: scale(0.95); transition: transform 0.2s;
            overflow: hidden;
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-header {
            padding: 20px 24px 0;
            font-size: 17px; font-weight: 700;
        }
        .modal-body {
            padding: 14px 24px 20px;
            font-size: 14px; color: var(--text-2); line-height: 1.7;
        }
        .modal-body input {
            width: 100%; height: 40px;
            padding: 0 12px; margin-top: 8px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font: inherit; font-size: 14px;
            outline: none;
            transition: border var(--transition);
        }
        .modal-body input:focus { border-color: var(--primary); }
        .modal-footer {
            display: flex; justify-content: flex-end; gap: 8px;
            padding: 0 24px 20px;
        }
        .modal-btn {
            height: 38px; padding: 0 18px;
            border: none; border-radius: var(--radius-xs);
            font: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all var(--transition);
        }
        .modal-btn-cancel { background: var(--surface); color: var(--text-2); }
        .modal-btn-cancel:hover { background: var(--hover-bg); }
        .modal-btn-primary { background: var(--primary); color: #fff; }
        .modal-btn-primary:hover { opacity: 0.9; }
        .modal-btn-danger { background: var(--danger); color: #fff; }
        .modal-btn-danger:hover { opacity: 0.9; }

        /* ── Shell ── */
        .admin-shell { max-width: 1520px; margin: 0 auto; padding: 28px 40px 60px; }

        /* ── Header ── */
        .admin-header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 20px; margin-bottom: 28px;
        }
        .admin-title h1 {
            font-size: 30px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .admin-title p { margin-top: 6px; color: var(--text-2); font-size: 14px; }
        .header-actions { display: flex; gap: 8px; }

        /* ── Buttons ── */
        .btn {
            height: 38px; border: none; border-radius: var(--radius-sm);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 0 16px;
            font: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; text-decoration: none;
            transition: all var(--transition);
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-ghost { background: var(--surface); color: var(--text-1); }
        .btn-ghost:hover { background: var(--hover-bg); }
        .btn-warning { background: var(--warning); color: #fff; }
        .btn-warning:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.9; }
        .btn-info { background: var(--info); color: #fff; }
        .btn-info:hover { opacity: 0.9; }
        .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-xs); }
        .btn-xs { height: 26px; padding: 0 8px; font-size: 11px; border-radius: 5px; }
        .btn[disabled] { opacity: 0.5; pointer-events: none; }

        /* ── Stat Cards ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px; margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex; align-items: flex-start; gap: 14px;
            box-shadow: var(--shadow-sm);
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-icon {
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-shrink: 0;
        }
        .stat-icon.green { background: var(--primary-glow); }
        .stat-icon.red { background: var(--danger-light); }
        .stat-icon.blue { background: var(--info-light); }
        .stat-icon.purple { background: var(--purple-light); }
        .stat-icon.yellow { background: var(--warning-light); }
        .stat-info { flex: 1; }
        .stat-label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.3px; }
        .stat-value { font-size: 28px; font-weight: 800; margin-top: 2px; line-height: 1.2; }
        .stat-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

        /* ── Tab Navigation ── */
        .tab-nav {
            display: flex; gap: 2px; margin-bottom: 24px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 3px; width: fit-content;
        }
        .tab-btn {
            height: 36px; padding: 0 18px;
            border: none; border-radius: var(--radius-xs);
            background: transparent;
            font: inherit; font-size: 13px; font-weight: 600;
            color: var(--text-2);
            cursor: pointer; transition: all var(--transition);
            white-space: nowrap;
        }
        .tab-btn:hover { color: var(--text-1); }
        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }

        /* ── Cards ── */
        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 16px; padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
        }
        .card-header h2 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .card-header h2 .card-icon { font-size: 20px; }
        .card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-body { padding: 0; }
        .card-body-padded { padding: 20px 24px; }

        /* ── Table ── */
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 12px 16px; text-align: left;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }
        th {
            color: var(--text-3); font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.4px;
            background: var(--surface); white-space: nowrap;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(16, 163, 127, 0.03); }
        td { font-size: 13px; }

        /* ── Badges ── */
        .badge {
            display: inline-flex; align-items: center;
            height: 22px; padding: 0 8px;
            border-radius: 999px; font-size: 11px; font-weight: 700;
        }
        .badge-ok { background: rgba(16,163,127,0.1); color: var(--primary-dark); }
        .badge-danger { background: var(--danger-light); color: #dc2626; }
        .badge-muted { background: var(--surface); color: var(--text-2); }
        .badge-info { background: var(--info-light); color: var(--info); }
        .badge-admin { background: var(--purple-light); color: var(--purple); }

        /* ── Code ── */
        code {
            background: var(--surface); padding: 3px 7px;
            border-radius: 5px; font-size: 12px;
            font-family: 'SF Mono', 'Consolas', monospace;
            cursor: pointer; transition: background var(--transition);
        }
        code:hover { background: var(--hover-bg); }

        /* ── Action Button Group ── */
        .action-group { display: flex; gap: 4px; flex-wrap: wrap; }

        /* ── Input ── */
        .admin-input, .admin-select {
            height: 38px; padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            background: var(--card-bg); color: var(--text-1);
            font: inherit; font-size: 13px;
            outline: none; transition: border var(--transition);
        }
        .admin-input:focus, .admin-select:focus { border-color: var(--primary); }
        .admin-input { width: 80px; }
        .admin-select { min-width: 160px; }

        /* ── Tab Panels ── */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Messages ── */
        .message-list { display: grid; gap: 10px; padding: 20px 24px; }
        .message-item {
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            background: var(--card-bg);
            transition: border-color var(--transition);
        }
        .message-item:hover { border-color: var(--primary-glow); }
        .message-meta {
            display: flex; justify-content: space-between; gap: 12px;
            color: var(--text-3); font-size: 12px; margin-bottom: 8px;
        }
        .message-user {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-1); font-weight: 700;
        }
        .message-user-avatar {
            width: 20px; height: 20px; border-radius: 50%;
            background: var(--primary-glow); color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800;
        }
        .message-content {
            color: var(--text-1); line-height: 1.65;
            white-space: pre-wrap; word-break: break-word;
            font-size: 13px;
        }

        /* ── Session Detail Drawer ── */
        .drawer-overlay {
            position: fixed; inset: 0; z-index: 8000;
            background: rgba(0,0,0,0.3);
            display: none; opacity: 0;
            transition: opacity 0.25s;
        }
        .drawer-overlay.show { display: block; opacity: 1; }
        .drawer {
            position: fixed; top: 0; right: -520px; bottom: 0; z-index: 8001;
            width: 520px; max-width: 90vw;
            background: var(--card-bg);
            box-shadow: -4px 0 24px rgba(0,0,0,0.1);
            transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
            display: flex; flex-direction: column;
        }
        .drawer.open { right: 0; }
        .drawer-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .drawer-header h3 { font-size: 16px; font-weight: 700; }
        .drawer-close {
            width: 32px; height: 32px; border: none;
            border-radius: var(--radius-xs);
            background: var(--surface); color: var(--text-2);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background var(--transition);
        }
        .drawer-close:hover { background: var(--hover-bg); }
        .drawer-body { flex: 1; overflow-y: auto; padding: 16px 24px; }

        /* Session list inside drawer */
        .session-list-item {
            padding: 12px 14px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all var(--transition);
        }
        .session-list-item:hover { border-color: var(--primary); background: rgba(16,163,127,0.02); }
        .session-list-item.active { border-color: var(--primary); background: var(--primary-glow); }
        .session-title-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .session-title-text { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .session-msg-count { font-size: 11px; color: var(--text-3); }
        .session-time { font-size: 11px; color: var(--text-3); margin-top: 3px; }

        /* Chat messages in drawer */
        .chat-bubble {
            margin-bottom: 12px;
            max-width: 88%;
        }
        .chat-bubble.user { margin-left: auto; text-align: right; }
        .chat-bubble-label { font-size: 11px; color: var(--text-3); margin-bottom: 3px; font-weight: 600; }
        .chat-bubble-content {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-word;
        }
        .chat-bubble.user .chat-bubble-content {
            background: var(--primary); color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-bubble.assistant .chat-bubble-content {
            background: var(--surface); color: var(--text-1);
            border-bottom-left-radius: 4px;
        }

        /* ── Log Items ── */
        .log-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-light);
        }
        .log-item:last-child { border-bottom: none; }
        .log-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--primary);
            margin-top: 6px; flex-shrink: 0;
        }
        .log-dot.danger { background: var(--danger); }
        .log-dot.warning { background: var(--warning); }
        .log-dot.info { background: var(--info); }
        .log-content { flex: 1; }
        .log-action { font-size: 13px; font-weight: 600; }
        .log-detail { font-size: 12px; color: var(--text-2); margin-top: 2px; }
        .log-time { font-size: 11px; color: var(--text-3); white-space: nowrap; }

        /* ── Empty State ── */
        .empty { padding: 40px; text-align: center; color: var(--text-3); font-size: 13px; }
        .empty-icon { font-size: 36px; margin-bottom: 8px; }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .admin-shell { padding: 20px 16px; }
            .admin-header { flex-direction: column; align-items: flex-start; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .card-header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .tab-nav { overflow-x: auto; width: 100%; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div class="admin-loading" id="loadingScreen">
    <div class="spinner"></div>
    <div style="color: var(--text-2); font-size: 14px;">正在验证管理员权限...</div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <div class="modal-header" id="confirmTitle">确认操作</div>
        <div class="modal-body" id="confirmBody">确定要执行此操作吗？</div>
        <div class="modal-footer">
            <button class="modal-btn modal-btn-cancel" onclick="closeConfirm()">取消</button>
            <button class="modal-btn" id="confirmBtn" onclick="doConfirm()">确定</button>
        </div>
    </div>
</div>

<!-- Session Detail Drawer -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="sessionDrawer">
    <div class="drawer-header">
        <h3 id="drawerTitle">用户会话详情</h3>
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody">
        <div class="empty">选择一个用户查看其会话</div>
    </div>
</div>

<!-- Main Content -->
<div class="admin-shell" id="adminContent" style="display:none;">

    <!-- Header -->
    <div class="admin-header">
        <div class="admin-title">
            <h1>🛠 小进后台管理</h1>
            <p>管理用户、邀请码，监控消息内容与系统运行状态</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-ghost" onclick="refreshAll()">🔄 刷新数据</button>
            <a href="/" class="btn btn-primary">← 返回前台</a>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon green">👥</div>
            <div class="stat-info">
                <div class="stat-label">用户总数</div>
                <div class="stat-value" id="statUsers">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon red">🚫</div>
            <div class="stat-info">
                <div class="stat-label">封禁用户</div>
                <div class="stat-value" id="statBanned">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue">💬</div>
            <div class="stat-info">
                <div class="stat-label">总消息数</div>
                <div class="stat-value" id="statMessages">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon purple">📁</div>
            <div class="stat-info">
                <div class="stat-label">总会话数</div>
                <div class="stat-value" id="statSessions">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon yellow">🎟️</div>
            <div class="stat-info">
                <div class="stat-label">邀请码剩余</div>
                <div class="stat-value" id="statCodes">-</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">⚡</div>
            <div class="stat-info">
                <div class="stat-label">今日活跃</div>
                <div class="stat-value" id="statActive">-</div>
                <div class="stat-sub" id="statTodayMsgs">-</div>
            </div>
        </div>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('users')">👥 用户管理</button>
        <button class="tab-btn" onclick="switchTab('codes')">🎟️ 邀请码</button>
        <button class="tab-btn" onclick="switchTab('messages')">💬 消息监控</button>
        <button class="tab-btn" onclick="switchTab('logs')">📋 操作日志</button>
    </div>

    <!-- Tab: Users -->
    <div class="tab-panel active" id="panel-users">
        <div class="admin-card">
            <div class="card-header">
                <h2><span class="card-icon">👥</span> 用户管理</h2>
                <div class="card-actions">
                    <button class="btn btn-ghost btn-sm" onclick="fetchUsers()">刷新</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th><th>用户名</th><th>角色</th><th>状态</th>
                                <th>会话</th><th>消息</th><th>最后发言</th><th>注册时间</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab: Invite Codes -->
    <div class="tab-panel" id="panel-codes">
        <div class="admin-card">
            <div class="card-header">
                <h2><span class="card-icon">🎟️</span> 邀请码管理</h2>
                <div class="card-actions">
                    <input type="number" id="codeCount" class="admin-input" value="1" min="1" max="100">
                    <button class="btn btn-primary btn-sm" onclick="generateCodes()">生成邀请码</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUnusedCodes()">清理未使用</button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th><th>邀请码</th><th>状态</th><th>创建者</th>
                                <th>生成时间</th><th>使用者</th><th>使用时间</th><th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="codesTable"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Tab: Messages -->
    <div class="tab-panel" id="panel-messages">
        <div class="admin-card">
            <div class="card-header">
                <h2><span class="card-icon">💬</span> 用户消息监控</h2>
                <div class="card-actions">
                    <select id="messageUserFilter" class="admin-select" onchange="fetchMessages()">
                        <option value="">全部用户</option>
                    </select>
                    <select id="messageLimit" class="admin-select" onchange="fetchMessages()">
                        <option value="50">最近 50 条</option>
                        <option value="100" selected>最近 100 条</option>
                        <option value="200">最近 200 条</option>
                        <option value="500">最近 500 条</option>
                    </select>
                    <button class="btn btn-ghost btn-sm" onclick="fetchMessages()">刷新</button>
                </div>
            </div>
            <div class="card-body">
                <div class="message-list" id="messagesList"></div>
            </div>
        </div>
    </div>

    <!-- Tab: Logs -->
    <div class="tab-panel" id="panel-logs">
        <div class="admin-card">
            <div class="card-header">
                <h2><span class="card-icon">📋</span> 管理员操作日志</h2>
                <div class="card-actions">
                    <button class="btn btn-ghost btn-sm" onclick="fetchLogs()">刷新</button>
                </div>
            </div>
            <div class="card-body card-body-padded" id="logsContainer">
                <div class="empty">加载中...</div>
            </div>
        </div>
    </div>

</div><!-- /.admin-shell -->

<script>
// ============================================================
//  Globals & Cache
// ============================================================
let usersCache = [];
let currentAdminId = null;
let confirmCallback = null;

// ============================================================
//  Utility: HTML Escape
// ============================================================
function esc(val) {
    return String(val ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
//  Utility: Format Time
// ============================================================
function fmtTime(val) {
    if (!val) return '<span style="color:var(--text-3)">-</span>';
    const d = new Date(val.endsWith?.('Z') ? val : val + 'Z');
    return d.toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function fmtTimeFull(val) {
    if (!val) return '-';
    const d = new Date(val.endsWith?.('Z') ? val : val + 'Z');
    return d.toLocaleString('zh-CN');
}

// ============================================================
//  Toast Notification
// ============================================================
function toast(message, type = 'success') {
    const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.innerHTML = `<span class="toast-icon">${icons[type] || '✅'}</span><span>${esc(message)}</span>`;
    container.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    setTimeout(() => {
        el.classList.add('hide');
        setTimeout(() => el.remove(), 400);
    }, 3500);
}

// ============================================================
//  Confirm Modal
// ============================================================
function showConfirm(title, body, btnText, btnClass, callback) {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmBody').innerHTML = body;
    const btn = document.getElementById('confirmBtn');
    btn.textContent = btnText;
    btn.className = 'modal-btn ' + btnClass;
    confirmCallback = callback;
    const overlay = document.getElementById('confirmModal');
    overlay.style.display = 'flex';
    requestAnimationFrame(() => overlay.classList.add('show'));
}
function closeConfirm() {
    const overlay = document.getElementById('confirmModal');
    overlay.classList.remove('show');
    setTimeout(() => { overlay.style.display = 'none'; }, 200);
    confirmCallback = null;
}
function doConfirm() {
    if (confirmCallback) confirmCallback();
    closeConfirm();
}

// ============================================================
//  API Fetch with Auth Check
// ============================================================
async function api(url, options) {
    const res = await fetch(url, options);
    if (res.status === 401 || res.status === 403) {
        toast('无权访问或登录已失效，即将跳转...', 'error');
        setTimeout(() => window.location = '/', 1500);
        throw new Error('Unauthorized');
    }
    return res;
}

// ============================================================
//  Auth Check on Load
// ============================================================
async function checkAdmin() {
    try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (!data.authenticated || data.role !== 'admin') {
            document.getElementById('loadingScreen').innerHTML =
                '<div style="text-align:center"><div style="font-size:48px;margin-bottom:16px">🔒</div>' +
                '<div style="font-size:16px;font-weight:600;margin-bottom:8px">无权访问</div>' +
                '<div style="color:var(--text-2);font-size:14px">仅管理员可访问后台管理系统</div>' +
                '<a href="/" style="display:inline-block;margin-top:16px;color:var(--primary);font-weight:600;text-decoration:none">返回首页 →</a></div>';
            return;
        }
        currentAdminId = data.id;
        document.getElementById('loadingScreen').classList.add('hide');
        document.getElementById('adminContent').style.display = 'block';
        setTimeout(() => document.getElementById('loadingScreen').remove(), 500);
        refreshAll();
    } catch (e) {
        document.getElementById('loadingScreen').innerHTML =
            '<div style="color:var(--danger)">❌ 连接失败</div>' +
            '<a href="/" style="color:var(--primary);margin-top:8px">返回首页</a>';
    }
}

// ============================================================
//  Tab Switching
// ============================================================
function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        const panels = ['users', 'codes', 'messages', 'logs'];
        btn.classList.toggle('active', panels[i] === name);
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    const panel = document.getElementById('panel-' + name);
    if (panel) panel.classList.add('active');

    // Lazy load data
    if (name === 'messages') fetchMessages();
    if (name === 'logs') fetchLogs();
}

// ============================================================
//  Fetch Stats
// ============================================================
async function fetchStats() {
    try {
        const res = await api('/api/admin/stats');
        const d = await res.json();
        document.getElementById('statUsers').textContent = d.total_users ?? '-';
        document.getElementById('statBanned').textContent = d.banned_users ?? '-';
        document.getElementById('statMessages').textContent = d.total_messages ?? '-';
        document.getElementById('statSessions').textContent = d.total_sessions ?? '-';
        document.getElementById('statCodes').textContent = d.unused_codes ?? '-';
        document.getElementById('statActive').textContent = d.today_active_users ?? '-';
        document.getElementById('statTodayMsgs').textContent = `今日 ${d.today_messages ?? 0} 条消息`;
    } catch (e) {
        // Fallback: calculate from users cache
        console.warn('Stats API not available, using fallback');
    }
}

// ============================================================
//  Fetch Users
// ============================================================
async function fetchUsers() {
    const res = await api('/api/admin/users');
    usersCache = await res.json();
    const tbody = document.getElementById('usersTable');

    // Update user filter dropdown
    const selected = document.getElementById('messageUserFilter').value;
    document.getElementById('messageUserFilter').innerHTML =
        '<option value="">全部用户</option>' +
        usersCache.map(u => `<option value="${u.id}">${esc(u.username)}</option>`).join('');
    document.getElementById('messageUserFilter').value = selected;

    // Fallback stats if stats API unavailable
    const totalMessages = usersCache.reduce((s, u) => s + Number(u.message_count || 0), 0);
    if (document.getElementById('statUsers').textContent === '-') {
        document.getElementById('statUsers').textContent = usersCache.length;
        document.getElementById('statBanned').textContent = usersCache.filter(u => u.is_banned).length;
        document.getElementById('statMessages').textContent = totalMessages;
    }

    tbody.innerHTML = usersCache.map(u => {
        const isSelf = u.id === currentAdminId;
        const status = u.is_banned
            ? '<span class="badge badge-danger">已封禁</span>'
            : '<span class="badge badge-ok">正常</span>';
        const roleBadge = u.role === 'admin'
            ? '<span class="badge badge-admin">管理员</span>'
            : '<span class="badge badge-muted">用户</span>';

        const banBtn = u.is_banned
            ? `<button class="btn btn-ghost btn-xs" onclick="toggleBan(${u.id}, false)">解封</button>`
            : `<button class="btn btn-warning btn-xs" onclick="toggleBan(${u.id}, true)" ${isSelf ? 'disabled' : ''}>封禁</button>`;

        const roleBtn = u.role === 'admin'
            ? `<button class="btn btn-ghost btn-xs" onclick="changeRole(${u.id}, 'user')" ${isSelf ? 'disabled' : ''}>降为用户</button>`
            : `<button class="btn btn-info btn-xs" onclick="changeRole(${u.id}, 'admin')">设为管理</button>`;

        return `<tr>
            <td>${u.id}</td>
            <td><strong>${esc(u.username)}</strong>${isSelf ? ' <span style="color:var(--primary);font-size:11px">(我)</span>' : ''}</td>
            <td>${roleBadge}</td>
            <td>${status}</td>
            <td>${u.session_count || 0}</td>
            <td>${u.message_count || 0}</td>
            <td>${fmtTime(u.last_message_at)}</td>
            <td>${fmtTime(u.created_at)}</td>
            <td>
                <div class="action-group">
                    ${banBtn}
                    ${roleBtn}
                    <button class="btn btn-ghost btn-xs" onclick="resetPassword(${u.id})">重置密码</button>
                    <button class="btn btn-ghost btn-xs" onclick="viewUserSessions(${u.id}, '${esc(u.username)}')">📁 会话</button>
                    <button class="btn btn-danger btn-xs" onclick="deleteUser(${u.id}, '${esc(u.username)}')" ${isSelf ? 'disabled' : ''}>注销</button>
                </div>
            </td>
        </tr>`;
    }).join('') || '<tr><td colspan="9" class="empty"><div class="empty-icon">👥</div>暂无用户数据</td></tr>';
}

// ============================================================
//  Fetch Invite Codes
// ============================================================
async function fetchCodes() {
    const res = await api('/api/admin/invite-codes');
    const data = await res.json();
    const tbody = document.getElementById('codesTable');
    tbody.innerHTML = data.map(c => `
        <tr>
            <td>${c.id}</td>
            <td><code onclick="copyCode('${esc(c.code)}')" title="点击复制">${esc(c.code)}</code></td>
            <td>${c.is_used
                ? '<span class="badge badge-danger">已使用</span>'
                : '<span class="badge badge-ok">可用</span>'}</td>
            <td>${esc(c.creator_name || '-')}</td>
            <td>${fmtTime(c.created_at)}</td>
            <td>${esc(c.user_name || '-')}</td>
            <td>${fmtTime(c.used_at)}</td>
            <td>${!c.is_used
                ? `<button class="btn btn-danger btn-xs" onclick="deleteCode(${c.id})">删除</button>`
                : '<span style="color:var(--text-3)">-</span>'}</td>
        </tr>
    `).join('') || '<tr><td colspan="8" class="empty"><div class="empty-icon">🎟️</div>暂无邀请码</td></tr>';
}

// ============================================================
//  Fetch Messages
// ============================================================
async function fetchMessages() {
    const userId = document.getElementById('messageUserFilter').value;
    const limit = document.getElementById('messageLimit').value;
    let url = `/api/admin/messages?limit=${limit}`;
    if (userId) url += `&user_id=${userId}`;
    const res = await api(url);
    const data = await res.json();
    const list = document.getElementById('messagesList');
    list.innerHTML = data.map(m => `
        <div class="message-item">
            <div class="message-meta">
                <span class="message-user">
                    <span class="message-user-avatar">${esc((m.username || '?')[0].toUpperCase())}</span>
                    ${esc(m.username)}
                    <span style="font-weight:400;color:var(--text-3)">· ${esc(m.session_title || '未命名')}</span>
                </span>
                <span>${fmtTime(m.created_at)}</span>
            </div>
            <div class="message-content">${esc(m.content)}</div>
        </div>
    `).join('') || '<div class="empty"><div class="empty-icon">💬</div>暂无用户消息</div>';
}

// ============================================================
//  Fetch Logs
// ============================================================
async function fetchLogs() {
    try {
        const res = await api('/api/admin/logs?limit=50');
        const data = await res.json();
        const container = document.getElementById('logsContainer');
        if (!data.length) {
            container.innerHTML = '<div class="empty"><div class="empty-icon">📋</div>暂无操作日志</div>';
            return;
        }
        const actionLabels = {
            'ban_user': '封禁用户', 'unban_user': '解封用户',
            'delete_user': '注销用户', 'change_role': '修改角色',
            'reset_password': '重置密码',
            'generate_codes': '生成邀请码', 'delete_code': '删除邀请码',
            'delete_unused_codes': '清理邀请码'
        };
        const actionDots = {
            'ban_user': 'danger', 'unban_user': 'info',
            'delete_user': 'danger', 'change_role': 'warning',
            'reset_password': 'warning',
            'generate_codes': '', 'delete_code': 'danger',
            'delete_unused_codes': 'danger'
        };
        container.innerHTML = data.map(l => `
            <div class="log-item">
                <div class="log-dot ${actionDots[l.action] || ''}"></div>
                <div class="log-content">
                    <div class="log-action">${actionLabels[l.action] || l.action}</div>
                    <div class="log-detail">
                        管理员 <strong>${esc(l.admin_name || '?')}</strong>
                        ${l.target_name ? ` → 用户 <strong>${esc(l.target_name)}</strong>` : ''}
                        ${l.detail ? ` · ${esc(l.detail)}` : ''}
                    </div>
                </div>
                <div class="log-time">${fmtTimeFull(l.created_at)}</div>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('logsContainer').innerHTML =
            '<div class="empty"><div class="empty-icon">📋</div>操作日志接口暂不可用</div>';
    }
}

// ============================================================
//  Actions: Generate Invite Codes
// ============================================================
async function generateCodes() {
    const count = parseInt(document.getElementById('codeCount').value, 10) || 1;
    const res = await api('/api/admin/invite-codes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ count })
    });
    const data = await res.json();
    if (data.ok) {
        toast(`成功生成 ${data.codes.length} 个邀请码`, 'success');
        // Show codes in confirm modal for easy copying
        const codesHtml = data.codes.map(c =>
            `<code onclick="navigator.clipboard.writeText('${c}');this.style.background='var(--primary-glow)'" style="display:block;padding:8px 12px;margin:4px 0;cursor:pointer" title="点击复制">${c}</code>`
        ).join('');
        showConfirm('新生成的邀请码', `<div style="font-size:13px;color:var(--text-2);margin-bottom:8px">点击邀请码可快速复制</div>${codesHtml}`, '完成', 'modal-btn-primary', () => {});
        fetchCodes();
        fetchStats();
    } else {
        toast(data.error || '生成失败', 'error');
    }
}

// ============================================================
//  Actions: Delete Code
// ============================================================
function deleteCode(id) {
    showConfirm('删除邀请码', '确定要删除这个未使用的邀请码吗？', '删除', 'modal-btn-danger', async () => {
        const res = await api(`/api/admin/invite-codes/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) { toast('邀请码已删除'); fetchCodes(); fetchStats(); }
        else toast(data.error || '删除失败', 'error');
    });
}

// ============================================================
//  Actions: Delete Unused Codes
// ============================================================
function deleteUnusedCodes() {
    showConfirm('批量清理邀请码', '确定要删除所有<strong>未使用</strong>的邀请码吗？<br>已使用的邀请码不会受影响。', '全部清理', 'modal-btn-danger', async () => {
        try {
            const res = await api('/api/admin/invite-codes/unused', { method: 'DELETE' });
            const data = await res.json();
            if (data.ok) {
                toast(`已清理 ${data.deleted_count ?? ''} 个未使用的邀请码`);
                fetchCodes(); fetchStats();
            } else {
                toast(data.error || '清理失败', 'error');
            }
        } catch (e) {
            toast('清理接口暂不可用', 'error');
        }
    });
}

// ============================================================
//  Actions: Copy Code
// ============================================================
function copyCode(code) {
    navigator.clipboard.writeText(code).then(() => toast('邀请码已复制到剪贴板'));
}

// ============================================================
//  Actions: Ban/Unban User
// ============================================================
function toggleBan(id, banned) {
    const user = usersCache.find(u => u.id === id);
    const name = user ? user.username : id;
    const action = banned ? '封禁' : '解封';
    const msg = banned
        ? `确定要封禁用户「<strong>${esc(name)}</strong>」吗？<br>封禁后该用户无法登录和发送消息。`
        : `确定要解封用户「<strong>${esc(name)}</strong>」吗？`;

    showConfirm(`${action}用户`, msg, action, banned ? 'modal-btn-danger' : 'modal-btn-primary', async () => {
        const res = await api(`/api/admin/users/${id}/ban`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ banned })
        });
        const data = await res.json();
        if (data.ok) { toast(`已${action}用户「${name}」`); refreshAll(); }
        else toast(data.error || `${action}失败`, 'error');
    });
}

// ============================================================
//  Actions: Change Role
// ============================================================
function changeRole(id, newRole) {
    const user = usersCache.find(u => u.id === id);
    const name = user ? user.username : id;
    const label = newRole === 'admin' ? '管理员' : '普通用户';
    showConfirm('修改角色', `确定要将用户「<strong>${esc(name)}</strong>」的角色修改为 <strong>${label}</strong> 吗？`, '确定修改', 'modal-btn-primary', async () => {
        try {
            const res = await api(`/api/admin/users/${id}/role`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: newRole })
            });
            const data = await res.json();
            if (data.ok) { toast(`已将「${name}」设为${label}`); refreshAll(); }
            else toast(data.error || '修改失败', 'error');
        } catch (e) {
            toast('角色修改接口暂不可用', 'error');
        }
    });
}

// ============================================================
//  Actions: Reset Password
// ============================================================
function resetPassword(id) {
    const user = usersCache.find(u => u.id === id);
    const name = user ? user.username : id;
    showConfirm('重置密码',
        `将用户「<strong>${esc(name)}</strong>」的密码重置为默认密码。` +
        `<input type="text" id="newPwdInput" placeholder="默认: Xj@123456（留空使用默认值）" style="margin-top:12px" />`,
        '确认重置', 'modal-btn-danger', async () => {
        const newPwd = document.getElementById('newPwdInput')?.value?.trim() || '';
        try {
            const body = newPwd ? { new_password: newPwd } : {};
            const res = await api(`/api/admin/users/${id}/reset-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.ok) toast(`已重置「${name}」的密码`);
            else toast(data.error || '重置失败', 'error');
        } catch (e) {
            toast('密码重置接口暂不可用', 'error');
        }
    });
}

// ============================================================
//  Actions: Delete User
// ============================================================
function deleteUser(id, name) {
    showConfirm('注销用户',
        `⚠️ 即将永久注销用户「<strong>${esc(name)}</strong>」<br><br>` +
        `此操作将删除该用户的：<br>• 所有聊天会话和消息记录<br>• 关联的邀请码使用记录<br><br>` +
        `<strong style="color:var(--danger)">此操作无法恢复！</strong>`,
        '确认注销', 'modal-btn-danger', async () => {
        const res = await api(`/api/admin/users/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.ok) { toast(`用户「${name}」已注销`); refreshAll(); }
        else toast(data.error || '注销失败', 'error');
    });
}

// ============================================================
//  Drawer: View User Sessions
// ============================================================
async function viewUserSessions(userId, username) {
    document.getElementById('drawerTitle').textContent = `${username} 的会话记录`;
    document.getElementById('drawerBody').innerHTML = '<div class="empty">加载中...</div>';
    openDrawer();

    try {
        const res = await api(`/api/admin/users/${userId}/sessions`);
        const sessions = await res.json();
        if (!sessions.length) {
            document.getElementById('drawerBody').innerHTML = '<div class="empty"><div class="empty-icon">📁</div>该用户暂无会话记录</div>';
            return;
        }
        document.getElementById('drawerBody').innerHTML =
            '<div id="drawerSessionList">' +
            sessions.map(s => `
                <div class="session-list-item" onclick="loadSessionMessages('${s.session_id}', this)">
                    <div class="session-title-row">
                        <span class="session-title-text">${esc(s.title)}</span>
                        <span class="session-msg-count">${s.message_count} 条消息</span>
                    </div>
                    <div class="session-time">${fmtTimeFull(s.updated_at)}</div>
                </div>
            `).join('') +
            '</div>' +
            '<div id="drawerChatArea" style="margin-top:16px;display:none"></div>';
    } catch (e) {
        document.getElementById('drawerBody').innerHTML = '<div class="empty">会话接口暂不可用</div>';
    }
}

async function loadSessionMessages(sessionId, clickedEl) {
    // Highlight active
    document.querySelectorAll('.session-list-item').forEach(el => el.classList.remove('active'));
    if (clickedEl) clickedEl.classList.add('active');

    const chatArea = document.getElementById('drawerChatArea');
    chatArea.style.display = 'block';
    chatArea.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-3)">加载消息中...</div>';

    try {
        const res = await api(`/api/admin/sessions/${sessionId}/messages`);
        const messages = await res.json();
        if (!messages.length) {
            chatArea.innerHTML = '<div class="empty">此会话暂无消息</div>';
            return;
        }
        chatArea.innerHTML = messages.map(m => `
            <div class="chat-bubble ${m.role}">
                <div class="chat-bubble-label">${m.role === 'user' ? '👤 用户' : '🤖 助手'} · ${fmtTime(m.created_at)}</div>
                <div class="chat-bubble-content">${esc(m.content).substring(0, 2000)}${m.content.length > 2000 ? '...' : ''}</div>
            </div>
        `).join('');
        chatArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
    } catch (e) {
        chatArea.innerHTML = '<div class="empty">消息加载失败</div>';
    }
}

function openDrawer() {
    document.getElementById('drawerOverlay').classList.add('show');
    document.getElementById('sessionDrawer').classList.add('open');
}
function closeDrawer() {
    document.getElementById('drawerOverlay').classList.remove('show');
    document.getElementById('sessionDrawer').classList.remove('open');
}

// ============================================================
//  Refresh All
// ============================================================
async function refreshAll() {
    await Promise.all([fetchStats(), fetchCodes(), fetchUsers()]);
}

// ============================================================
//  Init
// ============================================================
window.onload = checkAdmin;
</script>
